name: 1.20.1 forge Server - 雲端世界備份 (ZeroTier VPN)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [1.20.1-forge-server-zerotier-vpn]

jobs:
  minecraft:
    runs-on: ubuntu-latest
    
    env:
      RCON_PASSWORD: ${{ secrets.RCON_PASSWORD }}
      RCON_PORT: ${{ secrets.RCON_PORT }}
      API_TOKEN: ${{ secrets.API_TOKEN }}

    steps:
      - name: 檢出 repo 檔案
        uses: actions/checkout@v4

      - name: 替換 server.properties 中的 RCON 設定
        run: |
          sed -i "s|rcon.password=.*|rcon.password=${RCON_PASSWORD}|" server.properties
          sed -i "s|rcon.port=.*|rcon.port=${RCON_PORT}|" server.properties

      - name: 清理 workfork
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h .

      - name: 安裝 Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: 安裝 screen
        run: sudo apt-get install -y screen

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 初始化 Node.js 並安裝 Express
        run: |
          cd minecraft-log-stream
          npm init -y
          npm install express

      - name: 下載上一次成功執行的 Artifact (使用 Secrets、防卡關版)
        uses: dawidd6/action-download-artifact@v8
        # 💡 第一面防死金牌：下載若失敗也直接進下一步
        continue-on-error: true
        with:
          # 💡 換回你指定的變數，權限最完整
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 💡 請記得換成你目前這個 Workflow 的 yml 檔名（例如 main.yml）
          workflow: start.yml 
          name: mc-parts
          workflow_conclusion: success
          path: ./
          # 如果沒找到，只警告不報錯
          if_no_artifact_found: warn

      - name: 終極空間優化：tar.zst 串流解壓 (支援多分卷、防卡關版)
        # 💡 第二面防死金牌：解壓噴錯或沒檔案也直接進下一步
        continue-on-error: true
        run: |
          echo "1. 檢查是否有分卷檔案..."
          if ls world.tar.zst.* 1>/dev/null 2>&1; then
            echo "找到備份檔案，開始串流解壓..."
            cat world.tar.zst.* | unzstd | tar -xf -
            
            echo "3. 檢查解壓結果..."
            if [ -d "world" ]; then
              echo "成功！world 資料夾已就緒。"
              du -sh world/
              rm world.tar.zst.*
            else
              echo "⚠️ 警告：解壓出來好像沒有 world 資料夾，但我們不管它，繼續前進！"
            fi
          else
            echo "⚠️ 提示：沒有找到任何歷史備份檔案，跳過解壓，直接進入下一步！"
          fi

      - name: 安裝 ZeroTier CLI
        run: |
          for i in {1..5}; do
            echo "Attempt $i to install ZeroTier"
            curl -f -s https://install.zerotier.com -o install.sh && break
            echo "Retrying in 5 seconds..."
            sleep 5
          done

          if [ ! -f install.sh ]; then
            echo "❌ Failed to download install script from install.zerotier.com"
            exit 1
          fi

          chmod +x install.sh
          sudo ./install.sh

      - name: 匯入 ZeroTier 身份檔案（保證固定 IP）
        # 💡 核心魔法：只有當 ZT_IDENTITY_SECRET 有填寫時，才執行這個步驟
        run: |
          # 1. 在 Bash 中定義變數，如果 secrets 不可用，GitHub 會自動替換為空字串，且不會噴語法錯誤
          ZT_SECRET="${{ secrets.ZT_IDENTITY_SECRET }}"

          # 2. 用 Linux Shell 檢查變數是否為空 (-z 代表長度為 0)
          if [ -z "$ZT_SECRET" ]; then
            echo "⚠️ 提示：未偵測到 ZT_IDENTITY_SECRET（可能是外部 Fork 或未設定 Secret），跳過此步驟！"
            exit 0 # 💡 正常退出，讓工作流繼續往下一步走
          fi

          echo "偵測到 ZT_IDENTITY_SECRET，開始匯入..."
          sudo systemctl stop zerotier-one

          echo "${{ secrets.ZT_IDENTITY_SECRET }}" | sudo tee /var/lib/zerotier-one/identity.secret > /dev/null
          sudo chmod 600 /var/lib/zerotier-one/identity.secret

          sudo systemctl start zerotier-one

          echo "等待 identity.public 生成..."
          for i in {1..10}; do
            if [ -f /var/lib/zerotier-one/identity.public ]; then
              echo "✅ identity.public 已生成"
              break
            fi
            echo "⏳ identity.public 尚未出現，等待 1 秒..."
            sleep 1
          done

          echo "目前身份："
          sudo cat /var/lib/zerotier-one/identity.public || echo "⚠️ 無法讀取身份"

      - name: 加入 ZeroTier 網路
        env:
          ZT_NETWORK_ID: ${{ secrets.ZEROTIER_NETWORK_ID }}
        run: |
          echo "✅ 檢查 ZeroTier 服務是否啟動..."
          for i in {1..10}; do
            if sudo zerotier-cli info &>/dev/null; then
              echo "✅ ZeroTier 服務已啟動"
              break
            fi
            echo "⏳ 等待 ZeroTier 服務啟動... ($i/10)"
            sleep 2
          done

          echo "🚀 嘗試加入 ZeroTier 網路：$ZT_NETWORK_ID"
          sudo zerotier-cli join $ZT_NETWORK_ID || {
            echo "❌ 加入 ZeroTier 網路失敗"
            exit 1
          }

          echo "🕓 等待 ZeroTier 成功連線..."
          for i in {1..20}; do
            NET_INFO=$(sudo zerotier-cli listnetworks | grep "$ZT_NETWORK_ID")
            echo "網路狀態詳細資訊：$NET_INFO"
            if echo "$NET_INFO" | grep -q "OK"; then
              echo "✅ 已成功加入 ZeroTier 網路"
              break
            fi
            sleep 3
          done

      - name: 測試
        run: sudo ss -nuap | grep 9993

      - name: 顯示 ZeroTier IP
        run: sudo zerotier-cli listnetworks

      - name: 顯示 ZeroTier 身份檔案（只用一次）
        run: |
          echo "========== BEGIN identity.secret =========="
          sudo cat /var/lib/zerotier-one/identity.secret
          echo "=========== END identity.secret ==========="

      - name: 啟動 Neo-forge Server（使用 screen）
        run: |

          screen -L -dmS minecraft java -Xmx12288M -Xms1024M -jar minecraft_server.jar nogui

          # 啟動 API 服務
          cd minecraft-log-stream
          nohup node api.js > api.log 2>&1 &

          # 等待 API 健康檢查成功
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/health >/dev/null; then
              echo "API is up!"
              break
            else
              echo "Waiting for API..."
              sleep 1
            fi
          done

      - name: 啟動 Log Viewer Server
        run: |
          cd minecraft-log-stream
          nohup node server.js > /dev/null 2>&1 &
          echo "Node server 已啟動於背景"

              # 健康檢查循環：等候 API 回應成功為止
          for i in {1..30}; do
            if curl --silent --fail http://localhost:3000/health >/dev/null; then
              echo "API is up!"
              break
            else
              echo "Waiting for API..."
              sleep 1
            fi
          done

      - name: 顯示當前目錄與檔案
        run: |
          echo "目前目錄："
          pwd
          echo "檔案列表："
          ls -al

      - name: Minecraft Server 運行中（最多 5 小時或手動關閉）
        run: |
          echo "伺服器啟動成功，最多運行 5 小時。"

          start_time=$(date +%s)
          timeout=$((5 * 60 * 60)) # 5 小時
          while screen -list | grep -q "minecraft"; do
            now=$(date +%s)
            elapsed=$((now - start_time))
            if [ $elapsed -ge $timeout ]; then
              echo "已達 5 小時，準備自動關閉伺服器..."
              break
            fi
            sleep 10
          done
          echo "伺服器已關閉或到時，繼續下一步..."

      - name: 優雅關閉 Minecraft 伺服器（如果還活著）
        run: |
          if screen -list | grep -q "minecraft"; then
            echo "伺服器仍在運行，執行 stop 指令..."
            screen -S minecraft -p 0 -X stuff "save-all flush$(printf \\r)"
            screen -S minecraft -p 0 -X stuff "stop$(printf \\r)"
            sleep 15
          else
            echo "伺服器已關閉，無需再次 stop。"
          fi

      - name: 📥 導出崩潰報告 (Artifact)
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-crash-reports
          path: |
            /home/runner/work/NightfallCraft_server/NightfallCraft_server/crash-reports/*.txt
            /home/runner/work/NightfallCraft_server/NightfallCraft_server/logs/latest.log
          if-no-files-found: ignore
          retention-days: 2

      - name: 💾 備份階段：壓縮 (極限省空間)
        if: always() # 確保伺服器關閉後一定執行
        run: |
          SOURCE_DIR="world"
          tar -cf - "$SOURCE_DIR" | zstd -T0 -3 -o world.tar.zst
          split -n 2 -d world.tar.zst world.tar.zst.
          rm world.tar.zst

      - name: 🚀 執行官方 Action 上傳 (保留 2 天)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-parts
          path: world.tar.zst.*
          retention-days: 2
          if-no-files-found: error

      # 最後一個 step 觸發自己重新執行
      - name: 觸發下一次執行
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}       # ✅ 內建 token，有觸發本 repo 的權限
          repository: ${{ github.repository }}      # ✅ 自己的 repo
          event-type: 1.20.1-forge-server-zerotier-vpn
